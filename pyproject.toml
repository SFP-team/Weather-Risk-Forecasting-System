[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blueberry-weather-risk"
version = "0.1.0"
description = "Florida blueberry weather risk forecasting and decision-support system"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Raghav Rathi", email = "rathi.raghav2409@gmail.com" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "httpx>=0.27.0",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "scikit-learn>=1.5.0",
  "python-dateutil>=2.9.0",
  "sqlalchemy>=2.0.0",
  "aiosqlite>=0.20.0",
  "joblib>=1.4.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.5.0"]

[project.scripts]
blueberry-pipeline = "pipelines.run_all:main"
blueberry-api = "services.api.app.main:run"

[tool.setuptools.packages.find]
where = ["packages/common", "packages/ingest", "packages/features", "packages/risk", "packages/models", "services", "."]
include = ["blueberry_common*", "blueberry_ingest*", "blueberry_features*", "blueberry_risk*", "blueberry_models*", "api*", "pipelines*"]

[tool.setuptools.package-dir]
"" = "."
"blueberry_common" = "packages/common/blueberry_common"
"blueberry_ingest" = "packages/ingest/blueberry_ingest"
"blueberry_features" = "packages/features/blueberry_features"
"blueberry_risk" = "packages/risk/blueberry_risk"
"blueberry_models" = "packages/models/blueberry_models"
