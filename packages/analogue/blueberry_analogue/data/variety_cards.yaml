# Blueberry Analogue cultivar × class cards.
# Hours 0-7.2 C, UF 32-45 F, and Dynamic Model portions are different currencies.
# Do not convert linearly. Run hours and portions in parallel, plus a negation counter.
# Sources: UF/IFAS EDIS HS216, MG359, HS1362; Fall Creek / Planasa sheets;
# González-Villagra 2024; Hao (Duke heat); Yang, Bryla, Strik 2019; O'Neal flower/leaf mismatch;
# Chilean Legacy blocks; OSU Willamette guidance.

meta:
  version: 1
  product: blueberry-analogue
  license: curated table, not an API
  notes:
    - SHB lethal temperatures are still borrowed from NHB in UF HS216.
    - Inland Michigan winter can kill Legacy/Draper fruit buds.
    - OSU: do not plant Emerald, Jewel, Star, Biloxi, or Snowchaser in the Willamette.
    - Legacy is the hybrid exception in the Willamette.
    - Evergreen is a clock on SHB genetics, not a fifth species.

floral_stages:
  - id: dormant
    msu_uga: 2
    bbch: "00-01"
    lt_c_low: -20.0
    lt_c_high: -12.0
    notes: Resting buds. NHB hardy; SHB and evergreen foliage much less so.
  - id: tight_cluster
    msu_uga: 3
    bbch: "51-55"
    lt_c_low: -7.0
    lt_c_high: -5.0
    notes: UF HS216 tight cluster.
  - id: pink
    msu_uga: 5
    bbch: "57-59"
    lt_c_low: -4.4
    lt_c_high: -2.8
    notes: UF HS216 pink.
  - id: full_bloom
    msu_uga: 6
    bbch: "60-65"
    lt_c_low: -2.2
    lt_c_high: -2.2
    notes: UF HS216 full bloom about -2.2 C.
  - id: petal_fall
    msu_uga: 7
    bbch: "67-69"
    lt_c_low: -2.2
    lt_c_high: -1.1
    notes: Still near bloom sensitivity.
  - id: green_fruit
    msu_uga: 8
    bbch: "71-79"
    lt_c_low: 0.0
    lt_c_high: 0.0
    notes: Green fruit killed at 0 C. Evergreen foliage dies with open flowers.
  - id: harvest
    msu_uga: 9
    bbch: "81-89"
    lt_c_low: 0.0
    lt_c_high: 0.0
    notes: Ripe fruit quality, not plant survival.

